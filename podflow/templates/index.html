<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podflow</title>
  <link rel="stylesheet" href="/templates/css/index.css" />
  <link rel="stylesheet" href="/templates/css/config.css" />
  <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
  <nav id="menu">
    <div class="menu-header">
      <span class="menu-app-name">Podflow</span>
      <h3>菜单栏</h3>
    </div>
    <ul>
      <li data-page="pageMessage">Podflow 运行情况</li>
      <li data-page="pageChannel">获取媒体频道 ID</li>
      <li data-page="pageConfig">修改配置</li>
      <li data-page="pageYoutubeCookie">YouTube🍪修改</li>
    </ul>
    <div class="menu-footer">
      <label class="youtube-cookie-setting" for="alwaysUseYoutubeCookie">
        <span class="youtube-cookie-copy">
          <span>YouTube🍪</span>
          <small id="youtubeCookieStatus"></small>
        </span>
        <input type="checkbox" id="alwaysUseYoutubeCookie" role="switch" />
        <span class="ios-switch" aria-hidden="true"></span>
      </label>
      <div class="favorite-update-control">
        <span id="favoriteUpdateCountdown">倒计运行时间：--:--:--</span>
        <button type="button" id="immediateUpdateBtn" class="ios-secondary-button" disabled>立即更新</button>
      </div>
    </div>
    <div id="version-info">
      Version: 1.0.2
    </div>
  </nav>
  <button id="toggleMenu" type="button" aria-label="隐藏侧边栏" aria-controls="menu" aria-expanded="true">
    <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M4 5.5h16M4 12h16M4 18.5h16"/></svg>
  </button>
  <div class="top-right-controls">
      <button id="playlistToggleBtn" class="icon-toggle-btn" type="button" title="切换播客" aria-label="切换播客">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
  </div>
  <div id="playlistOverlay" class="playlist-overlay"></div>
  <aside id="playlistDrawer" class="playlist-drawer" role="dialog" aria-label="播客列表" aria-hidden="true">
      <div class="playlist-drawer-header">
          <span>播客列表</span>
          <button id="playlistCloseBtn" class="btn" type="button" aria-label="关闭">✕</button>
      </div>
      <div id="playlistBody" class="playlist-body">
          <div class="playlist-status">正在加载列表…</div>
      </div>
  </aside>
  <main id="main">
    <section id="pageChannel" style="display: none;">
      <h2>获取媒体频道 ID</h2>
      <form id="inputForm" method="post" action="getid">
        <label for="inputOutput">请输入：</label><br>
        <textarea class="common-area" name="inputOutput" id="inputOutput"></textarea><br>
        <div class="button-container">
          <button type="button" id="pasteBtn">📋 粘贴</button>
          <button type="submit">✅ 提交</button>
          <button type="button" id="copyBtn">📄 拷贝</button>
          <button type="button" id="clearBtn">🗑️ 清空</button>
        </div>
        <p class="hint">📌 如果粘贴按钮无效，请长按输入框手动粘贴。</p>
      </form>
    </section>

    <section id="pageMessage">
      <h2>Podflow 运行情况</h2>
      <form>
        <label>主进度条：</label><br>
        <div class="pb-bar" id="mainProgressBar">
          <div class="pb-progress pb-animated" id="mainProgress"></div>
          <div class="pb-status-text" id="progressStatus">准备中</div>
          <div class="pb-percentage-text" id="progressPercentage">0.00%</div>
        </div>
        <label id="downloadLabel"></label><br>
        <div class="common-area" id="messageDownload"></div>
        <label>构建服务：</label><br>
        <div class="common-area" id="messageArea"></div>
        <label>收发服务：</label><br>
        <div class="common-area" id="messageHttp"></div>
      </form>
    </section>

    <section id="pageConfig" style="display: none;">
      <h2>修改配置</h2>
      <button type="button" id="toggleConfigDisplay" class="ios-disclosure" aria-expanded="true">
        <span>配置内容</span><span class="disclosure-icon">⌄</span>
      </button>
      <div id="configContent">
        <div id="configContainer">
          <p>正在加载配置...</p>
        </div>
        <div class="button-container">
          <button type="button" id="refreshConfigBtn">🔄 刷新配置</button>
          <button type="button" id="saveConfigBtn">💾 保存配置</button>
        </div>
        <div id="configStatus" style="margin-top: 10px; color: green;"></div>
      </div>
    </section>

    <section id="pageYoutubeCookie" style="display: none;">
      <h2>YouTube🍪修改</h2>
      <p class="hint">📌 路径：channel_data/yt_dlp_youtube.txt（Netscape 格式）</p>
      <textarea class="common-area" id="youtubeCookieEditor" placeholder="# Netscape HTTP Cookie File
.youtube.com	TRUE	/	TRUE	0	GPS	1
..."></textarea>
      <div class="button-container">
        <button type="button" id="refreshYoutubeCookieBtn">🔄 刷新</button>
        <button type="button" id="saveYoutubeCookieBtn">💾 保存</button>
      </div>
      <div id="youtubeCookieStatus" style="margin-top: 10px;"></div>
    </section>

  </main>
  <div id="menuBackdrop" aria-hidden="true"></div>



  <script src="/templates/js/index.js"></script>
  <script src="/templates/js/qrcode.min.js"></script>
  <script src="/templates/js/config.js"></script>
  <script src="/templates/js/youtube_cookie.js"></script>
</body>
</html>
